<title id="title">M1: CNN remote sensing super-resolution architecture</title><desc id="desc">Implemented computation graph including internal attention or Transformer operations, reconstruction, PixelShuffle, and bicubic residual addition. Shapes use N batch, C bands, d feature width, H and W input dimensions, s scale.</desc>
