<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1022" viewBox="0 0 1120 1022" role="img" aria-labelledby="title desc">
<title id="title">M7: CNN + Attention + Transformer remote sensing super-resolution architecture</title><desc id="desc">Implemented computation graph including internal attention or Transformer operations, reconstruction, PixelShuffle, and bicubic residual addition. Shapes use N batch, C bands, d feature width, H and W input dimensions, s scale.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243b53"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1b7f5a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><text x="560" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#102a43">M7: CNN + Attention + Transformer</text><rect x="110" y="82" width="900" height="62" rx="14" fill="#e8f1fb" stroke="#243b53" stroke-width="2"/><text x="560" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Input LR: N × C × H × W</text><path d="M560 146 L560 163" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="166" width="900" height="68" rx="14" fill="#e8f1fb" stroke="#243b53" stroke-width="2"/><text x="560" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Embedding: Conv 3×3, C → d</text><path d="M560 236 L560 253" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="256" width="900" height="74" rx="14" fill="#fff0d9" stroke="#243b53" stroke-width="2"/><text x="560" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Parallel local path: f + Conv3×3 → ReLU → Conv3×3</text><path d="M560 332 L560 349" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="352" width="900" height="74" rx="14" fill="#fff0d9" stroke="#243b53" stroke-width="2"/><text x="560" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Parallel window Transformer: pad → tokens + position → LayerNorm → 2-head attention + residual →</text><text x="560" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">LayerNorm → FFN + residual → unpad</text><path d="M560 428 L560 445" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="448" width="900" height="74" rx="14" fill="#fff0d9" stroke="#243b53" stroke-width="2"/><text x="560" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Concatenate (2d) → 1×1 projection (d)</text><path d="M560 524 L560 541" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="544" width="900" height="74" rx="14" fill="#fff0d9" stroke="#243b53" stroke-width="2"/><text x="560" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Channel gate: GAP → 1×1 reduce/expand → sigmoid → multiply</text><path d="M560 620 L560 637" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="640" width="900" height="74" rx="14" fill="#fff0d9" stroke="#243b53" stroke-width="2"/><text x="560" y="677" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Spatial gate: channel mean/max → concat → 7×7 convolution → sigmoid → multiply</text><path d="M560 716 L560 733" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="736" width="900" height="68" rx="14" fill="#e8f1fb" stroke="#243b53" stroke-width="2"/><text x="560" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Reconstruction Conv 3×3, d → C·s²</text><path d="M560 806 L560 823" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="826" width="900" height="62" rx="14" fill="#e8f1fb" stroke="#243b53" stroke-width="2"/><text x="560" y="857" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">PixelShuffle(s): N × C × sH × sW</text><path d="M560 890 L560 907" stroke="#243b53" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="910" width="900" height="62" rx="14" fill="#dff3e5" stroke="#243b53" stroke-width="2"/><text x="560" y="941" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#102a43">Add bicubic baseline Bₛ(y) → SR output</text><path d="M1010 113 H1060 V941 H1015" fill="none" stroke="#1b7f5a" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#green)"/>
<text x="560" y="1014" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#486581">Solid arrows: learned feature path · dashed green arrow: bicubic skip · Diagram follows src/rssr/models.py</text></svg>