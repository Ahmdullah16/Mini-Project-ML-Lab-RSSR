[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rssr-lab"
version = "0.1.0"
description = "Auditable educational remote-sensing super-resolution laboratory"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "Pillow", "rasterio"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbclient", "ipykernel", "matplotlib", "pandas", "psutil"]
demo = ["gradio"]

[project.scripts]
rssr = "rssr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "stage_01_python_numpy/MP01_digital_image_explorer", "stage_07_transformers/MP27_self_attention_from_scratch", "stage_07_transformers/MP28_multi_head_self_attention"]
