[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rssr-lab"
version = "0.1.0"
description = "Auditable educational remote-sensing super-resolution laboratory"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "Pillow", "rasterio"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbclient", "ipykernel", "matplotlib", "pandas", "psutil"]
demo = ["gradio"]

[project.scripts]
rssr = "rssr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "stage_01_python_numpy", "stage_02_image_processing", "stage_03_metrics", "stage_04_math_pytorch", "stage_05_cnn_sr", "stage_06_attention", "stage_07_transformers", "stage_08_remote_sensing", "stage_09_hybrid_research"]
