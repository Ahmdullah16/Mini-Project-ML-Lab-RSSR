name: Validation
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/check_structure.py
      - run: python scripts/check_project_folders.py
      - name: Rebuild frozen data from pinned public sources
        run: python scripts/rebuild_frozen_data.py --data-root data/ci-frozen-rebuild
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r app/requirements.txt
      - run: python scripts/check_showcase.py
      - run: python scripts/check_streamlit.py
      - run: python scripts/check_model_catalog.py
      - run: python scripts/check_comparison.py
